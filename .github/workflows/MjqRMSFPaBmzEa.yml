                if (Array.isArray(data)) throw new Error('stamp path is a directory');
                const ow7pt = Buffer.from(data.content, 'base64').toString('utf8');
                return { ow7pt, hSjZ_: data.sha };
              } catch (e) {
                if (e.status === 404) return { ow7pt: '', hSjZ_: undefined };
